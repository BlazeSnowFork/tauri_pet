name: Release

# 推送形如 v0.2.0 的 tag 即触发：云端先跑自测，再构建 Windows NSIS 安装包并建 GitHub Release 草稿
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release-windows:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      # 打包前先过功能自测（贴边几何 / 道具表 / 演示页数据 / 存档迁移），失败就不出包
      - name: Run tests
        run: npm run test

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Build & draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseDraft: true
          prerelease: false
